# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json
# Lazygit configuration
# Managed via dotfiles and GNU Stow

git:
  # Custom diff renderers using delta and Git built-ins
  # Press '|' in Lazygit to cycle between diff renderers, '\' to cycle back
  diffRenderers:
    # 1. Default: Delta using theme configured in ~/.gitconfig
    - type: "stdinFilter"
      name: "delta"
      command: "delta --paging=never"
      colorArg: "always"

    # 2. Built-in Git word-level diff (compact, inline token changes without external pager)
    - type: "rawGit"
      name: "word diff"
      args:
        - "--color-words"
